version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "NAudio.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
